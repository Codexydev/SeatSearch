<body>
    <div class="container-header">

                    <option value="Niepce">Niepce</option>

                    <option value="Gevrey">Gevrey</option>
                </select>
                <input class="header-item" type="number" id="tentacles" name="tentacles" min="10" max="100" placeholder="Numéro"/>
            </div>
            <a class="header-item" href="">Start</a>
        </div>
    </div>
