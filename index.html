<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css?v=1.2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Doto:wght@100..900&family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&family=Ultra&display=swap" rel="stylesheet">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Seat Search</title>
</head>
<body>
    <div class="container-header">
        <div class="header centered" id="header">
            <div class="title header-item">Seat Search</div>
            <div class="input-group">
                <select class="header-item" name="amphithéâtre" id="amphi-select">
                    <option value="">Choix Amphi</option> <option value="Paris">Paris</option>
                    <option value="Recoura">Recoura</option>
                    <option value="Niepce">Niepce</option>
                    <option value="Bernard">Bernard</option>
                    <option value="Gevrey">Gevrey</option>
                </select>
                <input class="header-item" type="number" id="number-input" name="number" min="10" max="100" placeholder="N°" inputmode="numeric" pattern="[0-9]*"/>
            </div>

            <a class="header-item btn-start" onclick="startSearch(event)">Start</a>
        </div>
    </div>

    <div class="container-global" id="amphi-container">
       <div class="amphi-container" >
            <svg id="amphi-plan" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
                <rect x="300" y="20" width="400" height="40" class="stage" />
                <text x="500" y="45" text-anchor="middle" class="stage-text">Tableau</text>
                
                <g id="seats-container"></g>
            </svg>
        </div>
    </div>

    <div class="motivation">
        <div class="motivation-text" id="motivation-text">
        </div>
    </div>

    <div class="container-footer">
        <div class="footer">© 2026 Antoine Ragot-Raillat.<br>All Rights Reserved.</div>
    </div>
    <script src="amphi.js?v=1.2"></script>
</body>
</html>
